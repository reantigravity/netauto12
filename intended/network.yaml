# =====================================================================
#  Intended state (source of truth) for the dual-stack lab network
#  CSS 312 Computer Networks - Topic 12: Configuration automation
#
#  Version 2: router-to-router links are SERIAL WAN links
#  (Packet Tracer "Serial DCE" cable, module HWIC-2T in each 2911).
#  Everything the scripts deploy and validate is derived from this file.
# =====================================================================

meta:
  project: "Configuration automation with Python (Netmiko/NETCONF)"
  author: "Gaziz Kenzhaly"
  ipv4_block: 10.12.0.0/16          # whole IPv4 space of the project
  ipv6_block: 2001:db8:12::/48      # whole IPv6 space (documentation prefix)

defaults:
  domain_name: netauto.local
  ospf:
    process_id: 1
    area: 0

# ---------------------------------------------------------------------
#  Management: where the Python automation code lives and runs.
#  The scripts run on this host and reach every router over SSH
#  (Netmiko) or NETCONF. Routers accept SSH/Telnet ONLY from here.
# ---------------------------------------------------------------------
management:
  host: NETAUTO-SRV
  ssh_user: netauto              # password comes from NETAUTO_SECRET, never from git

# ---------------------------------------------------------------------
#  Routers: Cisco 2911 + HWIC-2T (Serial0/0/0, Serial0/0/1)
#  Topology: triangle R1-R2-R3 over serial links, one LAN per router.
#  clock_rate marks the DCE end of each serial link.
# ---------------------------------------------------------------------
routers:
  R1:
    role: HQ
    loopback0:
      ipv4: 10.12.0.1/32
      ipv6: 2001:db8:12::1/128
    interfaces:
      GigabitEthernet0/0:
        description: LAN-HQ
        ipv4: 10.12.10.1/24
        ipv6: 2001:db8:12:10::1/64
        link_local: fe80::1
        lan: true
      Serial0/0/0:
        description: WAN-to-R2
        ipv4: 10.12.255.1/30
        ipv6: 2001:db8:12:ff12::1/64
        link_local: fe80::1
        peer: R2:Serial0/0/0
        clock_rate: 64000          # DCE
      Serial0/0/1:
        description: WAN-to-R3
        ipv4: 10.12.255.5/30
        ipv6: 2001:db8:12:ff13::1/64
        link_local: fe80::1
        peer: R3:Serial0/0/0
        clock_rate: 64000          # DCE
    # Summary routes to Null0: drop traffic to unused parts of our blocks
    static_routes:
      - prefix: 10.12.0.0/16
        next_hop: Null0
      - prefix: 2001:db8:12::/48
        next_hop: Null0

  R2:
    role: Branch-1
    loopback0:
      ipv4: 10.12.0.2/32
      ipv6: 2001:db8:12::2/128
    interfaces:
      GigabitEthernet0/0:
        description: LAN-Branch1
        ipv4: 10.12.20.1/24
        ipv6: 2001:db8:12:20::1/64
        link_local: fe80::2
        lan: true
      Serial0/0/0:
        description: WAN-to-R1
        ipv4: 10.12.255.2/30
        ipv6: 2001:db8:12:ff12::2/64
        link_local: fe80::2
        peer: R1:Serial0/0/0         # DTE
      Serial0/0/1:
        description: WAN-to-R3
        ipv4: 10.12.255.9/30
        ipv6: 2001:db8:12:ff23::1/64
        link_local: fe80::2
        peer: R3:Serial0/0/1
        clock_rate: 64000          # DCE
    static_routes: []

  R3:
    role: Branch-2
    loopback0:
      ipv4: 10.12.0.3/32
      ipv6: 2001:db8:12::3/128
    interfaces:
      GigabitEthernet0/0:
        description: LAN-Branch2
        ipv4: 10.12.30.1/24
        ipv6: 2001:db8:12:30::1/64
        link_local: fe80::3
        lan: true
      Serial0/0/0:
        description: WAN-to-R1
        ipv4: 10.12.255.6/30
        ipv6: 2001:db8:12:ff13::2/64
        link_local: fe80::3
        peer: R1:Serial0/0/1         # DTE
      Serial0/0/1:
        description: WAN-to-R2
        ipv4: 10.12.255.10/30
        ipv6: 2001:db8:12:ff23::2/64
        link_local: fe80::3
        peer: R2:Serial0/0/1         # DTE
    static_routes: []

# ---------------------------------------------------------------------
#  End hosts
# ---------------------------------------------------------------------
hosts:
  NETAUTO-SRV:                     # automation server: Python + Netmiko live here
    connected_to: R1:GigabitEthernet0/0
    ipv4: 10.12.10.100/24
    gateway4: 10.12.10.1
    ipv6: 2001:db8:12:10::100/64
    gateway6: fe80::1
  PC1:
    connected_to: R1:GigabitEthernet0/0
    ipv4: 10.12.10.10/24
    gateway4: 10.12.10.1
    ipv6: 2001:db8:12:10::10/64
    gateway6: fe80::1
  PC2:
    connected_to: R2:GigabitEthernet0/0
    ipv4: 10.12.20.10/24
    gateway4: 10.12.20.1
    ipv6: 2001:db8:12:20::10/64
    gateway6: fe80::2
  PC3:
    connected_to: R3:GigabitEthernet0/0
    ipv4: 10.12.30.10/24
    gateway4: 10.12.30.1
    ipv6: 2001:db8:12:30::10/64
    gateway6: fe80::3
